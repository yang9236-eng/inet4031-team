name: Deploy gate

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tofu:
    name: tofu fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: week-5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Check formatting
        run: tofu fmt -check -diff

      - name: Initialize
        run: tofu init -input=false

      - name: Validate
        run: tofu validate

  helm:
    name: render the Prometheus chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add the chart repository
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update prometheus-community

      - name: Render the chart with your values
        run: |
          helm template prometheus prometheus-community/prometheus \
            --version 29.35.0 \
            --namespace monitoring \
            --values week-6/prometheus-values.yaml > /dev/null
