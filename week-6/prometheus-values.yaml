# Lean Prometheus configuration for the lab VM.
alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

server:
  retention: 3d
  persistentVolume:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

scrapeConfigs:
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
